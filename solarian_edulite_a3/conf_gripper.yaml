# Default configuration for EduliteA3GripperModule (L7, aperture in cm).
#
# Use the same `port` as the arm so Robot multiplexes one USB-CAN adapter.

port: /dev/ttyUSB0
frequency: 30
interpolator_type: scalar
max_speed: 8.0
calibration_file: .cache/calibration/edulite_a3_gripper.json

# Vendor ros2_control jaw travel (~2–10 cm). Measure on hardware and override.
aperture_closed_cm: 2.0
aperture_open_cm: 10.0

actuators:
    gripper:
        id: 7
        model: el05
        port: ${port}
        type: robstride
        mode: range_m100_100
        sim:
            # Lives on the arm MJCF until a separate gripper export exists.
            # Prefix must match the arm ModuleAttachment prefix.
            joint: "arm/gripper"
            actuator: "arm/gripper"
            range_min: -1.5708
            range_max: 1.5708
            drive_mode: 0
