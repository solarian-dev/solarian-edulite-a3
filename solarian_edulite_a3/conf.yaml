# Default configuration for EduliteA3ArmModule.
#
# Copied into a project's conf/ directory (e.g. conf/right_arm.yaml).
# Arm and gripper share the same USB-CAN adapter: set the same port on both.

actuator_port: /dev/ttyUSB0
frequency: 90
interpolator_type: pose
drive_waypoints: true
max_speed: [0.25, 0.6]

# Vendor joint limits (radians) used for sim: until OnShape export replaces
# the kinematics MJCF. drive_mode 1 matches SDK direction -1.
actuators:
    shoulder_pan:
        id: 1
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/shoulder_pan"
        sim_range_min: -2.792526803
        sim_range_max: 2.792526803
        sim_drive_mode: 1
    shoulder_lift:
        id: 2
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/shoulder_lift"
        sim_range_min: 0
        sim_range_max: 3.438298626
        sim_drive_mode: 0
    elbow_flex:
        id: 3
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/elbow_flex"
        sim_range_min: 0
        sim_range_max: 3.628539515
        sim_drive_mode: 1
    wrist_flex:
        id: 4
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/wrist_flex"
        sim_range_min: -0.6702064328
        sim_range_max: 2.345722515
        sim_drive_mode: 0
    wrist_yaw:
        id: 5
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/wrist_yaw"
        sim_range_min: -1.570796327
        sim_range_max: 1.570796327
        sim_drive_mode: 1
    wrist_roll:
        id: 6
        port: ${actuator_port}
        mode: range_m100_100
        sim_joint: "arm/wrist_roll"
        sim_range_min: -3.141592654
        sim_range_max: 3.141592654
        sim_drive_mode: 0
