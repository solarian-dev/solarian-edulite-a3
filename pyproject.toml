[project]
name = "solarian-edulite-a3"
version = "0.1.1"
description = "EDULITE A3 arm and gripper modules for the Solarian robotics framework"
authors = [
    {name = "Raul Garreta", email = "raul@solarian.dev"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.10"
dependencies = [
    "solarian>=0.7.0",
    "solarian-robstride>=0.1.1",
]

[project.optional-dependencies]
# The servo SDKs, for the machine wired to the arm. Without them the modules
# still import, so a relay or controller can build the robot's schema.
hardware = [
    "solarian-robstride[hardware]>=0.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solarian_edulite_a3*"]

[tool.setuptools.package-data]
solarian_edulite_a3 = [
    "templates/modules/*.yaml",
    "assets/edulite_a3.xml",
    "assets/edulite_a3_description/config.json",
    "assets/edulite_a3_description/meshes/*.stl",
]

[project.entry-points."solarian.modules"]
edulite-a3-arm = "solarian_edulite_a3.arm:EduliteA3ArmModule"
